name: Release

# Publishing is driven by a tag: `git tag v0.4.0 && git push --tags`. The panel's
# published version comes from host/version.js, so a release and the panel build
# that announces it must be tagged together.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: linux
            goarch: '386'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go/go.mod
      - name: Test the agent
        working-directory: agent/go
        run: go vet ./... && go test ./...
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: agent/go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          # The asset name embeds the tag so the agent can build its own download
          # URL without an API call: .../v<version>/dsh-probe-agent_<ver>_<os>_<arch>
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${GOARCH}"
          if [ -n "${GOARM:-}" ]; then ARCH="arm${GOARM}"; fi
          go build -trimpath -ldflags '-s -w' -o "dsh-probe-agent_${VERSION}_${GOOS}_${ARCH}" .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/go/dsh-probe-agent_*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum dsh-probe-agent_* > SHA256SUMS
      - name: Attach the binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-probe-agent_*
            dist/SHA256SUMS
          generate_release_notes: true
